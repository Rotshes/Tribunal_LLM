[build]
  # No build step. The frontend is plain HTML, CSS and JavaScript served as-is.
  # See docs/decisions/0008-the-frontend-has-no-build-step.md — revisit if the
  # app grows past one screen.
  publish = "web"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

  # The function reads cases/*.json and prompts/*.md from disk at call time, so
  # they have to travel with it. Prompts are hashed per call and the hash goes
  # on every log row; if these were bundled stale, an opinion would be traceable
  # to the wrong text.
  included_files = ["cases/**", "prompts/**", "panel/**", "schemas/**"]

[functions."deliberate"]
  # Seven model calls, four in parallel then three in sequence. Observed
  # wall-clock is 30-35s against gemini-3.5-flash-lite; a slower model will be
  # slower. Netlify's synchronous limit is well under what a slow model could
  # take, so this is the known ceiling on model choice for the deployed app.
  # Recorded rather than discovered later.
  timeout = 26

[dev]
  publish = "web"
  functions = "netlify/functions"
