[build]
  # No build step. The frontend is plain HTML, CSS and JavaScript served as-is.
  # See docs/decisions/0008-the-frontend-has-no-build-step.md — revisit if the
  # app grows past one screen.
  publish = "web"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

  # The function reads cases/*.json and prompts/*.md from disk at call time, so
  # they have to travel with it. Prompts are hashed per call and the hash goes
  # on every log row; if these were bundled stale, an opinion would be traceable
  # to the wrong text.
  included_files = ["cases/**", "prompts/**", "panel/**", "schemas/**"]

# NO TIMEOUT SETTING HERE, DELIBERATELY — AND NO LONGER ANY NEED FOR ONE.
#
# `netlify/functions/deliberate.js` sets `background: true`, which gives it
# FIFTEEN MINUTES instead of the synchronous limit. The browser receives 202
# immediately and polls `GET /api/runs?id=` — the archive endpoint from turn
# 011 — until the run appears. Turn 013.
#
# The history is worth keeping, because it is the reason the app is shaped this
# way and because the same mistake is easy to repeat:
#
#   * An earlier version of this file invented `timeout = 26` from a
#     half-remembered figure and killed every browser run.
#   * Netlify's documentation says the synchronous limit is 60 seconds and is
#     not configurable. THIS SITE'S FUNCTION LOG SAYS OTHERWISE:
#
#       Aug 31, 03:28:13 PM  04e3f0da  Duration: 30000 ms  Memory Usage: 145 MB
#
#     30 seconds. Where the documentation and the deployment disagree, the log
#     is the one that observed this site.
#   * Three time budgets were then computed against 60 and all three lost whole
#     runs to a 504. The fourth, built on the measured 30, worked — and cut a
#     judge off after 7 seconds so the rest of the panel would fit.
#
# That last one is why this is a background function now. A tribunal whose
# third opinion depends on how long a platform is willing to wait is not the
# thing this project set out to build. The synchronous limit cannot be raised;
# the run does not have to be synchronous.
#
# MEASURED, 31.08.2026, the committed allocation (3.7-flash advocates,
# flash-lite judges), from a terminal:
#   waited 20.8s  ·  model time (sum of 7 calls) 66.1s  ·  concurrency gain 3.18x
#
# A per-call timeout of 120s remains in the function. A call that hangs forever
# is still a bug: it would hold a background invocation open for a quarter of an
# hour and produce nothing.
#
# Shape: four advocate calls concurrently, then three judge calls concurrently.

[dev]
  publish = "web"
  functions = "netlify/functions"
