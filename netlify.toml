[build]
  # No build step. The frontend is plain HTML, CSS and JavaScript served as-is.
  # See docs/decisions/0008-the-frontend-has-no-build-step.md — revisit if the
  # app grows past one screen.
  publish = "web"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

  # The function reads cases/*.json and prompts/*.md from disk at call time, so
  # they have to travel with it. Prompts are hashed per call and the hash goes
  # on every log row; if these were bundled stale, an opinion would be traceable
  # to the wrong text.
  included_files = ["cases/**", "prompts/**", "panel/**", "schemas/**"]

# NO TIMEOUT SETTING HERE, DELIBERATELY.
#
# THE LIMIT ON THIS SITE IS 30 SECONDS, MEASURED FROM THE FUNCTION LOG:
#
#   Aug 31, 03:28:13 PM  04e3f0da  Duration: 30000 ms  Memory Usage: 145 MB
#
# Netlify's documentation says the synchronous execution limit is 60 seconds and
# is not configurable. It is not describing this deployment. Where the two
# disagree, the log wins — it is the only source that observed this site.
#
# An earlier version of this file invented `timeout = 26` from a half-remembered
# figure and killed every browser run. The lesson was written down as "check,
# do not recall". Turn 012 then checked the documentation twice and shipped
# three broken budgets anyway, because checking the docs is not the same as
# checking the deployment. Both readings are now recorded above so the next
# person does not have to rediscover the discrepancy.
#
# The budget derived from 30s lives in netlify/functions/deliberate.js, with the
# arithmetic in the file. `FUNCTION_LIMIT_MS` overrides it — set that only when
# a function log shows a longer duration is actually allowed.
#
# MEASURED, 31.08.2026, the committed allocation (3.7-flash advocates,
# flash-lite judges), from a terminal where no platform limit applies:
#   waited 20.8s  ·  model time (sum of 7 calls) 66.1s  ·  concurrency gain 3.18x
#
# 20.8s against a 30s limit is not much room, and a mixed panel of slower models
# has repeatedly exceeded it. Calls are now cut off individually so the run
# returns rulings and failed columns instead of a platform error page.
#
# `netlify dev` runs functions through lambda-local with a 30-second cap, which
# turns out to match production here rather than being stricter than it.
#
# Shape: four advocate calls concurrently, then three judge calls concurrently.
#
# If the panel outgrows 30 seconds, the remaining answer is a background
# function with the page polling for the result — 15 minutes, and it costs the
# page its single synchronous request.

[dev]
  publish = "web"
  functions = "netlify/functions"
