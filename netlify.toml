[build]
  # No build step. The frontend is plain HTML, CSS and JavaScript served as-is.
  # See docs/decisions/0008-the-frontend-has-no-build-step.md — revisit if the
  # app grows past one screen.
  publish = "web"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

  # The function reads cases/*.json and prompts/*.md from disk at call time, so
  # they have to travel with it. Prompts are hashed per call and the hash goes
  # on every log row; if these were bundled stale, an opinion would be traceable
  # to the wrong text.
  included_files = ["cases/**", "prompts/**", "panel/**", "schemas/**"]

# NO TIMEOUT SETTING HERE, DELIBERATELY.
#
# Netlify's synchronous function limit is 60 seconds and is NOT configurable.
# An earlier version of this file set `timeout = 26` for the deliberate
# function, invented from a half-remembered figure. A deliberation takes about
# 35 seconds, so every run through the browser was killed — and the page
# reported it as a JSON parse error, because it was parsing Netlify's HTML
# error page.
#
# `netlify dev` is stricter than production: it runs functions through
# lambda-local with a 30-SECOND cap, observed twice. The browser could not
# complete a deliberation locally even though production would have allowed it.
#
# The three judges now run concurrently (src/deliberate.js) — they are
# independent by construction and sequencing bought nothing.
#
# MEASURED, 31.08.2026, gemini-3.5-flash-lite on all seven roles:
#   waited 13.6s  ·  model time (sum of 7 calls) 36.2s  ·  concurrency gain 2.67x
#
# The earlier numbers in this file ("~35s", "roughly 20s") were the SUMMED
# per-call latency read as though it were elapsed time. Concurrency does not
# change a sum, so that figure never moved and made the fix look ineffective
# when it had been working from the moment it was written. Elapsed time is now
# measured separately and reported as `waited`.
#
# 13.6s against a 30s local cap and a 60s production one. A mixed panel of
# slower models will be slower — that is the headroom to watch.
#
# Shape: four advocate calls concurrently, then three judge calls concurrently,
# against a 30s local cap and a 60s production one.
#
# If a slow model on every role ever exceeds even that, the remaining answer is
# a background function with the page polling for the result. Not needed yet,
# and it would cost the page its single synchronous request.

[dev]
  publish = "web"
  functions = "netlify/functions"
